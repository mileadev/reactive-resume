name: reactive_resume_prod

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable PostgreSQL image tag or digest}
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reactive_resume}
      POSTGRES_USER: ${POSTGRES_USER:-reactive_resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to an immutable Redis image tag or digest}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    networks: [data]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='$${REDIS_PASSWORD}' redis-cli ping | grep -q PONG"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE to an immutable SeaweedFS image tag or digest}
    restart: unless-stopped
    command: ["server", "-s3", "-filer", "-dir=/data", "-ip=0.0.0.0"]
    networks: [storage]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  create_bucket:
    image: ${MC_IMAGE:?Set MC_IMAGE to an immutable MinIO client image tag or digest}
    restart: "no"
    networks: [storage]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set seaweedfs http://seaweedfs:8333 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing seaweedfs/${S3_BUCKET:-reactive-resume}
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-reactive-resume}
    depends_on:
      seaweedfs:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  reactive_resume:
    image: ${REACTIVE_RESUME_IMAGE:?Set REACTIVE_RESUME_IMAGE to a signed immutable image digest}
    restart: unless-stopped
    init: true
    networks: [edge, data, storage]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL:?Set APP_URL to the external HTTPS URL}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using the postgres service hostname}
      AUTH_SECRET: ${AUTH_SECRET:?Set a strong AUTH_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set a 32+ character ENCRYPTION_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-reactive-resume}
      S3_FORCE_PATH_STYLE: "true"
      FLAG_DISABLE_API_RATE_LIMIT: "false"
      FLAG_ALLOW_UNSAFE_AI_BASE_URL: "false"
      FLAG_ALLOW_UNSAFE_OAUTH_REDIRECT_URI: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      create_bucket:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

networks:
  edge:
  data:
    internal: true
  storage:
    internal: true
